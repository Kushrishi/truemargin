name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install system dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopenslide0

      - name: Install package and research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[realdata,dev]"

      - name: Ruff
        run: ruff check src tests scripts

      - name: Black
        run: black --check src tests scripts

      - name: Mypy
        run: mypy

      - name: Tests
        run: pytest
