name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: m5-frozen-output-characterization

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install system dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopenslide0

      - name: Install package and research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[realdata,dev]"

      - name: Format M5 with pinned Black
        run: |
          black src/truemargin/m5_characterization.py tests/test_m5_characterization.py
          if ! git diff --quiet -- src/truemargin/m5_characterization.py tests/test_m5_characterization.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/truemargin/m5_characterization.py tests/test_m5_characterization.py
            git commit -m "Apply Black formatting to M5"
            git push origin HEAD:m5-frozen-output-characterization
          fi

      - name: Ruff
        run: ruff check src tests scripts

      - name: Black
        run: black --check src tests scripts

      - name: Mypy
        run: mypy

      - name: Tests
        run: pytest
