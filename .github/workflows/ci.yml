name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install system dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopenslide0

      - name: Install package and research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[realdata,dev]"

      - name: Ruff
        run: ruff check src tests scripts

      - name: Apply pinned Black formatting and restore CI
        run: |
          black src tests scripts
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml scripts/audit_m6_external_inputs.py tests/test_m6_external_input_audit.py
          if ! git diff --cached --quiet; then
            git commit -m "Apply pinned Black formatting"
            git push origin HEAD:m6-input-identity-audit
          fi

      - name: Stop after formatter push
        run: echo "Formatter-only diagnostic complete"
