name: TrueMargin M6 external input identity audit

on:
  push:
    branches: ["main"]
    paths:
      - "research/M6_INPUT_IDENTITY_AUDIT_REQUEST.json"
      - "research/M6_INPUT_IDENTITY_AUDIT_DIAGNOSTIC_1.json"
      - "research/M6_INPUT_IDENTITY_AUDIT_DIAGNOSTIC_2.json"
      - "research/M6_INPUT_IDENTITY_AUDIT_DIAGNOSTIC_3.json"
      - "scripts/audit_m6_external_inputs.py"
      - ".github/workflows/m6-input-identity-audit.yml"

permissions:
  contents: read

concurrency:
  group: truemargin-m6-input-identity-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Verify metadata-only authorization
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          request = json.loads(
              Path("research/M6_INPUT_IDENTITY_AUDIT_REQUEST.json").read_text()
          )
          expected = {
              "schema_version": 5,
              "milestone": "M6",
              "authorized_mode": "external-input-identity-audit",
              "result_bearing_authorized": False,
              "registration_authorized": False,
              "calibration_fit_authorized": False,
              "split_assignment_authorized": False,
              "dicom_download_authorized": False,
              "source_series_selection_authorized": False,
              "expected_output": "outputs/m6_input_identity_audit.json",
          }
          for key, value in expected.items():
              assert request.get(key) == value, (key, request.get(key), value)

          challenge = request["challenge"]
          assert challenge["doi"] == "10.7937/K9/TCIA.2015.zF0vlOPv"
          assert challenge["expected_total_subjects"] == 80
          assert challenge["expected_total_series"] == 80
          assert challenge["license"] == "CC BY 3.0"

          partitions = challenge["partitions"]
          assert set(partitions) == {"training", "leaderboard", "test"}
          assert (
              partitions["training"]["expected_subjects"],
              partitions["training"]["expected_series"],
          ) == (60, 60)
          assert (
              partitions["leaderboard"]["expected_subjects"],
              partitions["leaderboard"]["expected_series"],
          ) == (10, 10)
          assert (
              partitions["test"]["expected_subjects"],
              partitions["test"]["expected_series"],
          ) == (10, 10)
          assert partitions["training"]["official_image_manifest"] == (
              "ISBI-Prostate-Challenge-Training.tcia"
          )
          assert partitions["leaderboard"]["official_image_manifest"] == (
              "ISBI-Prostate-Challenge-LeaderBoard.tcia"
          )
          assert partitions["test"]["official_image_manifest"] == (
              "ISBI-Prostate-Challenge-Testing.tcia"
          )

          authority = request["image_identity_authority"]
          assert authority["training_manifest_required"] is True
          assert authority["leaderboard_manifest_required"] is True
          assert authority["test_manifest_required"] is True
          assert authority["shared_list_transport_failure_is_fatal"] is False
          assert authority["shared_list_uid_mismatch_is_fatal"] is True
          assert authority["analysis_doi_series_api_required"] is False

          patient_policy = request["patient_identity_policy"]
          assert patient_policy["accepted_challenge_namespaces"] == ["01", "02", "03"]
          assert patient_policy["partition_namespace_mapping_frozen"] is False
          assert patient_policy["record_observed_namespace_by_partition"] is True
          assert patient_policy["require_image_annotation_patient_id_agreement"] is True

          rules = request["audit_rules"]
          for key in (
              "require_exact_disjoint_60_10_10_partition_series",
              "resolve_exact_official_series_in_idc",
              "preserve_official_partition_identity",
              "preserve_source_collection_identity",
              "record_scanner_acquisition_metadata",
              "record_patient_namespace_by_partition",
              "audit_annotation_identity_separately",
              "derive_training_membership_from_official_training_manifest",
              "derive_leaderboard_membership_from_official_leaderboard_manifest",
              "derive_test_membership_from_official_test_manifest",
              "crosscheck_training_shared_list_when_reachable",
              "crosscheck_leaderboard_shared_list_when_reachable",
              "shared_list_uid_mismatch_blocks_identity",
          ):
              assert rules[key] is True, key
          for key in (
              "heuristic_source_series_selection",
              "assign_calibration_evaluation_reserve_roles",
              "download_source_dicoms",
              "run_registration",
              "fit_calibration",
              "shared_list_transport_failure_blocks_identity",
          ):
              assert rules[key] is False, key

          diagnostics = request["prior_diagnostics"]
          assert [item["workflow_run_id"] for item in diagnostics] == [
              36933944184,
              36940363311,
              36942271816,
          ]
          assert all(item["result_bearing_data_observed"] is False for item in diagnostics)

          print("M6_INPUT_IDENTITY_AUTHORIZATION=PASS")
          print("M6_CHALLENGE_IDENTITY_SURFACE=80")
          print("M6_PARTITION_AUTHORITY=OFFICIAL_TCIA_MANIFESTS")
          print("RESULT_BEARING_AUTHORIZED=False")
          PY

      - name: Run external input identity audit
        id: audit
        continue-on-error: true
        run: python scripts/audit_m6_external_inputs.py

      - name: Stamp and package audit evidence
        if: always()
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          output = Path("outputs/m6_input_identity_audit.json")
          if not output.exists():
              output.parent.mkdir(parents=True, exist_ok=True)
              output.write_text(
                  json.dumps(
                      {
                          "schema_version": 5,
                          "milestone": "M6",
                          "audit": "external-input-identity",
                          "status": "workflow_failed_before_audit_record",
                          "authorization_boundary": {
                              "result_bearing_authorized": False,
                              "registration_authorized": False,
                              "calibration_fit_authorized": False,
                              "split_assignment_authorized": False,
                              "dicom_download_performed": False,
                              "heuristic_source_series_selection_performed": False,
                          },
                      },
                      indent=2,
                      sort_keys=True,
                  )
                  + "\n"
              )

          payload = json.loads(output.read_text())

          def blob(path: str) -> str:
              return subprocess.check_output(
                  ["git", "hash-object", path], text=True
              ).strip()

          payload["provenance"] = {
              "source_git_sha": os.environ["GITHUB_SHA"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "request_blob_sha": blob(
                  "research/M6_INPUT_IDENTITY_AUDIT_REQUEST.json"
              ),
              "diagnostic_1_blob_sha": blob(
                  "research/M6_INPUT_IDENTITY_AUDIT_DIAGNOSTIC_1.json"
              ),
              "diagnostic_2_blob_sha": blob(
                  "research/M6_INPUT_IDENTITY_AUDIT_DIAGNOSTIC_2.json"
              ),
              "diagnostic_3_blob_sha": blob(
                  "research/M6_INPUT_IDENTITY_AUDIT_DIAGNOSTIC_3.json"
              ),
              "script_blob_sha": blob("scripts/audit_m6_external_inputs.py"),
              "workflow_blob_sha": blob(
                  ".github/workflows/m6-input-identity-audit.yml"
              ),
              "feasibility_blob_sha": blob("docs/m6_calibration_feasibility.md"),
          }
          output.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          digest = hashlib.sha256(output.read_bytes()).hexdigest()
          Path("outputs/m6_input_identity_audit.sha256").write_text(
              f"{digest}  {output.name}\n"
          )
          print(output.read_text())
          print(Path("outputs/m6_input_identity_audit.sha256").read_text())
          PY

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: truemargin-m6-input-identity-audit
          path: |
            docs/m6_calibration_feasibility.md
            research/M6_INPUT_IDENTITY_AUDIT_REQUEST.json
            research/M6_INPUT_IDENTITY_AUDIT_DIAGNOSTIC_1.json
            research/M6_INPUT_IDENTITY_AUDIT_DIAGNOSTIC_2.json
            research/M6_INPUT_IDENTITY_AUDIT_DIAGNOSTIC_3.json
            scripts/audit_m6_external_inputs.py
            outputs/m6_input_identity_audit.json
            outputs/m6_input_identity_audit.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Enforce audit outcome
        if: always()
        run: test "${{ steps.audit.outcome }}" = "success"
