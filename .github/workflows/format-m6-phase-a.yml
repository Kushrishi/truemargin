name: Format M6 Phase A branch

on:
  push:
    branches: ["m6-phase-a-calibration"]
    paths:
      - "scripts/m6_phase_a_calibration.py"
      - "tests/test_m6_phase_a_calibration.py"
      - ".github/workflows/format-m6-phase-a.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: m6-phase-a-calibration

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned formatter
        run: python -m pip install black==24.10.0

      - name: Format Phase A files
        run: black scripts/m6_phase_a_calibration.py tests/test_m6_phase_a_calibration.py

      - name: Commit formatter-only changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/m6_phase_a_calibration.py tests/test_m6_phase_a_calibration.py
          git commit -m "Format M6 Phase A implementation"
          git push origin HEAD:m6-phase-a-calibration
