name: Validate frozen IDC series identities

on:
  push:
    branches: ["fix-known-gt-full-series-identity"]

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install acquisition dependency
        run: python -m pip install idc-index==0.12.5
      - name: Validate all ten exact series identities
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path("scripts/fetch_known_gt_inputs.py")
          spec = importlib.util.spec_from_file_location("fetcher", path)
          assert spec is not None and spec.loader is not None
          fetcher = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(fetcher)

          identities = fetcher.load_frozen_series_identity()
          resolved = []
          for patient, identity in identities.items():
              rows, _ = fetcher._idc_series_rows(patient)
              selected = fetcher.resolve_frozen_series(
                  rows, patient=patient, identity=identity
              )
              resolved.append((patient, selected["SeriesInstanceUID"]))
              print(
                  f"{patient} SERIES_IDENTITY=PASS "
                  f"uid={selected['SeriesInstanceUID']} "
                  f"description={selected['SeriesDescription']!r} "
                  f"instances={selected['instanceCount']}"
              )

          assert len(resolved) == 10
          print("ALL_FROZEN_SERIES_IDENTITIES=PASS")
          PY
