name: TrueMargin known-GT geometry preflight

on:
  push:
    branches: ["main"]
    paths:
      - "research/KNOWN_GT_GEOMETRY_REQUEST.json"
      - "research/KNOWN_GT_GEOMETRY_RETRY.json"
      - "research/KNOWN_GT_GEOMETRY_RETRY_2.json"
      - "research/KNOWN_GT_GEOMETRY_RETRY_3.json"

permissions:
  contents: read

concurrency:
  group: truemargin-known-gt-geometry
  cancel-in-progress: false

jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Verify geometry-only request and technical retries
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          request_path = Path("research/KNOWN_GT_GEOMETRY_REQUEST.json")
          request = json.loads(request_path.read_text())
          expected = {
              "schema_version": 1,
              "study": "hyperparameter-known-gt-v1",
              "authorized_mode": "geometry-only",
              "result_bearing_authorized": False,
              "planned_cases": 30,
              "held_out_anatomies": [
                  "aaa0044", "aaa0051", "aaa0053", "aaa0060", "aaa0064",
                  "aaa0069", "aaa0071", "aaa0072", "aaa0086", "aaa0087"
              ],
              "protocol_main_blob_sha": "98a747c502a4aca6d8e65f8373bc4e62a8f1b7a0",
              "protocol_amendment_blob_sha": "1eafe77bb847b1a77229e267ef32e6bbedd27bc2",
          }
          for key, value in expected.items():
              assert request.get(key) == value, (key, request.get(key), value)

          retry_path = Path("research/KNOWN_GT_GEOMETRY_RETRY.json")
          retry = json.loads(retry_path.read_text())
          retry_expected = {
              "schema_version": 1,
              "study": "hyperparameter-known-gt-v1",
              "retry_number": 1,
              "retry_of_workflow_run_id": 36160471644,
              "failed_source_git_sha": "5911ce404b1cc0f167aafb64b54aa95b8aebab0f",
              "failure_stage": "fetch_frozen_public_inputs",
              "failure_class": "infrastructure_network_timeout",
              "scientific_configuration_changed": False,
              "result_bearing_authorized": False,
              "original_geometry_request_blob_sha": (
                  "a7bf7591850ed90f0cd7bd95ebae3552e77d32c7"
              ),
          }
          for key, value in retry_expected.items():
              assert retry.get(key) == value, (key, retry.get(key), value)

          retry2_path = Path("research/KNOWN_GT_GEOMETRY_RETRY_2.json")
          retry2 = json.loads(retry2_path.read_text())
          retry2_expected = {
              "schema_version": 1,
              "study": "hyperparameter-known-gt-v1",
              "retry_number": 2,
              "retry_of_workflow_run_id": 36162012654,
              "failed_source_git_sha": "f7fff7da11af7ce6db115b221c0e850efdd29d0b",
              "failure_stage": "resolve_frozen_public_series_identity",
              "failure_class": "implementation_identity_translation_error",
              "scientific_configuration_changed": False,
              "result_bearing_authorized": False,
              "original_geometry_request_blob_sha": (
                  "a7bf7591850ed90f0cd7bd95ebae3552e77d32c7"
              ),
              "full_series_identity_blob_sha": (
                  "4bb28ed69680179b02c78b75cb28f83a1966018c"
              ),
          }
          for key, value in retry2_expected.items():
              assert retry2.get(key) == value, (key, retry2.get(key), value)

          retry3_path = Path("research/KNOWN_GT_GEOMETRY_RETRY_3.json")
          retry3 = json.loads(retry3_path.read_text())
          retry3_expected = {
              "schema_version": 1,
              "study": "hyperparameter-known-gt-v1",
              "retry_number": 3,
              "retry_of_workflow_run_id": 36165197037,
              "failed_source_git_sha": "b4d3970d95c0a8c54af2a790930c562cc4e52518",
              "failure_stage": "fetch_frozen_public_inputs",
              "failure_class": "implementation_cli_argument_error",
              "scientific_configuration_changed": False,
              "result_bearing_authorized": False,
              "original_geometry_request_blob_sha": (
                  "a7bf7591850ed90f0cd7bd95ebae3552e77d32c7"
              ),
              "full_series_identity_blob_sha": (
                  "4bb28ed69680179b02c78b75cb28f83a1966018c"
              ),
          }
          for key, value in retry3_expected.items():
              assert retry3.get(key) == value, (key, retry3.get(key), value)

          request_blob = subprocess.check_output(
              ["git", "hash-object", str(request_path)], text=True
          ).strip()
          identity_path = Path("research/KNOWN_GT_SERIES_IDENTITY.json")
          identity_blob = subprocess.check_output(
              ["git", "hash-object", str(identity_path)], text=True
          ).strip()
          assert request_blob == retry["original_geometry_request_blob_sha"]
          assert request_blob == retry2["original_geometry_request_blob_sha"]
          assert request_blob == retry3["original_geometry_request_blob_sha"]
          assert identity_blob == retry2["full_series_identity_blob_sha"]
          assert identity_blob == retry3["full_series_identity_blob_sha"]
          print("TECHNICAL_RETRY_GUARDS=PASS")
          print("GEOMETRY_AUTHORIZATION=PASS")
          PY

      - name: Install package and acquisition dependencies
        run: python -m pip install -e ".[realdata,acquisition]"

      - name: Fetch frozen public inputs
        run: python scripts/fetch_known_gt_inputs.py

      - name: Run geometry-only preflight
        run: python scripts/19_hyperparameter_known_gt_validation.py --geometry-only

      - name: Package reviewed-candidate evidence
        run: |
          sha256sum outputs/hyperparameter_known_gt_geometry.json \
            > outputs/hyperparameter_known_gt_geometry.sha256
          cat outputs/known_gt_data_acquisition.json
          cat outputs/hyperparameter_known_gt_geometry.json
          cat outputs/hyperparameter_known_gt_geometry.sha256

      - name: Upload geometry evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: truemargin-known-gt-geometry-preflight
          path: |
            research/KNOWN_GT_GEOMETRY_REQUEST.json
            research/KNOWN_GT_GEOMETRY_RETRY.json
            research/KNOWN_GT_GEOMETRY_RETRY_2.json
            research/KNOWN_GT_GEOMETRY_RETRY_3.json
            research/KNOWN_GT_SERIES_IDENTITY.json
            outputs/known_gt_data_acquisition.json
            outputs/hyperparameter_known_gt_geometry.json
            outputs/hyperparameter_known_gt_geometry.sha256
          if-no-files-found: error
          retention-days: 90
