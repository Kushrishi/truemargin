name: CD source audit

on:
  push:
    branches: ["integrate-known-gt-local-comparators"]

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Probe released snapshot through Chrome
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --virtual-time-budget=8000 \
            --dump-dom \
            'https://anonymous.4open.science/r/dbc-B401/' \
            > /tmp/cd-page.html
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path("/tmp/cd-page.html").read_text(encoding="utf-8", errors="replace")
          print(f"CD_PAGE_BYTES={len(html.encode('utf-8'))}")
          print(f"CD_HAS_FORBIDDEN={'403' in html or 'Forbidden' in html}")
          print(f"CD_HAS_REPO_ID={'dbc-B401' in html}")
          for pattern in (
              r'href="([^"]+)"',
              r'>([^<>]{2,120})<',
          ):
              values = []
              for value in re.findall(pattern, html):
                  clean = " ".join(value.split())
                  if clean and clean not in values:
                      values.append(clean)
              for value in values[:120]:
                  print(value)
          PY
