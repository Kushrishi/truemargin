name: CD source audit

on:
  push:
    branches: ["integrate-known-gt-local-comparators"]

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Query released Anonymous-GitHub snapshot
        run: |
          set -euo pipefail
          URL='https://anonymous.4open.science/api/repo/dbc-B401/files?path='
          curl --fail-with-body --location --silent --show-error \
            --user-agent 'Mozilla/5.0' \
            --header 'Accept: application/json' \
            "$URL" -o /tmp/cd-files.json
          python - <<'PY'
          import json

          with open("/tmp/cd-files.json", encoding="utf-8") as handle:
              payload = json.load(handle)

          print(f"CD_ROOT_ENTRY_COUNT={len(payload)}")
          for entry in payload:
              print(json.dumps(entry, sort_keys=True))
          PY
