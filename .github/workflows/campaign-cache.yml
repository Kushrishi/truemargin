name: Campaign cache integration

on:
  pull_request:
    paths:
      - 'src/truemargin/**'
      - 'tests/test_campaign_cache.py'
      - 'tests/test_member_retention.py'
      - 'tests/test_registration_member.py'
      - 'tests/test_field_cache.py'
      - 'tests/test_blockwise_fields.py'
      - 'tests/test_external_analysis.py'
      - '.github/workflows/campaign-cache.yml'
  push:
    branches: [main]
    paths:
      - 'src/truemargin/**'
      - '.github/workflows/campaign-cache.yml'

permissions:
  contents: read

jobs:
  integration:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Install outcome-free test dependencies
        run: python -m pip install numpy==2.3.5 scipy pytest
      - name: Exercise production schemas using synthetic fields
        env:
          PYTHONPATH: src
        run: >-
          python -m pytest -o addopts='' -q
          tests/test_campaign_cache.py
          tests/test_member_retention.py
          tests/test_registration_member.py
          tests/test_field_cache.py
          tests/test_blockwise_fields.py
          tests/test_external_analysis.py
