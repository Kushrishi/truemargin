name: Diagnose known-GT IDC series identity

on:
  push:
    branches: ["diagnose-idc-series-identity"]

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install acquisition dependency
        run: python -m pip install idc-index==0.12.5
      - name: Print frozen-cohort T2 axial series metadata
        run: |
          python - <<'PY'
          import importlib.util
          import json
          from pathlib import Path

          path = Path("scripts/fetch_known_gt_inputs.py")
          spec = importlib.util.spec_from_file_location("fetcher", path)
          assert spec is not None and spec.loader is not None
          fetcher = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(fetcher)

          for patient, legacy_folder in fetcher.FROZEN_T2_SERIES_SUFFIXES.items():
              rows, response = fetcher._idc_series_rows(patient)
              candidates = []
              for row in rows:
                  desc = str(row.get("SeriesDescription", "")).upper()
                  if "T2" in desc and "AXIAL" in desc:
                      candidates.append(
                          {
                              "patient": patient,
                              "legacy_folder": legacy_folder,
                              "StudyInstanceUID": row.get("StudyInstanceUID"),
                              "SeriesInstanceUID": row.get("SeriesInstanceUID"),
                              "SeriesDescription": row.get("SeriesDescription"),
                              "instanceCount": row.get("instanceCount"),
                              "series_size_MB": row.get("series_size_MB"),
                              "Modality": row.get("Modality"),
                          }
                      )
              print(json.dumps({"patient": patient, "candidates": candidates}, sort_keys=True))
          PY
