name: TrueMargin M6 Phase A calibration

on:
  push:
    branches: ["main"]
    paths:
      - "research/M6_PHASE_A_REQUEST.json"

permissions:
  contents: read

concurrency:
  group: truemargin-m6-phase-a-calibration
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      patients: ${{ steps.matrix.outputs.patients }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install package and research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[realdata,dev]"

      - name: Verify source-pinned Phase A authorization
        run: python scripts/m6_phase_a_calibration.py --verify-only

      - name: Verify frozen input registry source identity
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          path = Path("research/M6_PHASE_A_INPUT_FREEZE.json")
          request = json.loads(Path("research/M6_PHASE_A_REQUEST.json").read_text(encoding="utf-8"))
          source_sha = str(request["source_git_sha"])
          frozen = subprocess.check_output(
              ["git", "show", f"{source_sha}:{path.as_posix()}"]
          )
          current = path.read_bytes()
          if current != frozen:
              raise RuntimeError(
                  "M6 Phase A input freeze differs from the authorized source commit"
              )
          print(f"M6_PHASE_A_INPUT_FREEZE=PINNED source_git_sha={source_sha}")
          PY

      - name: Re-run focused pre-result contract
        run: |
          pytest -q \
            tests/test_hierarchical_conformal.py \
            tests/test_m6_phase_a_geometry_freeze.py \
            tests/test_m6_phase_a_calibration.py \
            tests/test_hyperparameter_known_gt.py \
            tests/test_comparators.py

      - name: Build calibration-only matrix
        id: matrix
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          split = json.loads(Path("research/M6_SPLIT.json").read_text())
          patients = sorted(
              patient
              for source in ("prostate_3t", "prostate_diagnosis")
              for patient in split["roles"][source]["calibration"]
          )
          evaluation = {
              patient
              for source in ("prostate_3t", "prostate_diagnosis")
              for patient in split["roles"][source]["evaluation"]
          }
          assert len(patients) == 30
          assert set(patients).isdisjoint(evaluation)
          print("patients=" + json.dumps(patients, separators=(",", ":")))
          PY

  labels:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install package and transport dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[realdata]"

      - name: Verify source-pinned Phase A authorization
        run: python scripts/m6_phase_a_calibration.py --verify-only

      - name: Stage and verify frozen calibration labels once
        run: |
          python - <<'PY'
          import hashlib
          import json
          import runpy
          import time
          from pathlib import Path

          base = runpy.run_path(
              "scripts/m6_deformation_preflight.py",
              run_name="m6_phase_a_label_transport",
          )
          freeze = json.loads(
              Path("research/M6_PHASE_A_INPUT_FREEZE.json").read_text(encoding="utf-8")
          )["calibration"]
          expected_patients = set(freeze)
          assert len(expected_patients) == 30

          last_error = None
          payload = None
          for attempt in range(1, 5):
              try:
                  candidate = base["_download"](base["TRAINING_LABEL_URL"], timeout=120)
                  labels = base["label_members"](candidate)
                  missing = sorted(expected_patients - set(labels))
                  if missing:
                      raise RuntimeError(f"staged archive is missing frozen labels: {missing}")
                  for patient_id in sorted(expected_patients):
                      observed = hashlib.sha256(labels[patient_id]).hexdigest()
                      expected = freeze[patient_id]["label_sha256"]
                      if observed != expected:
                          raise RuntimeError(
                              f"frozen label identity mismatch for {patient_id}: "
                              f"{observed} != {expected}"
                          )
                  payload = candidate
                  break
              except base["TransportUnavailable"] as exc:
                  last_error = exc
                  if attempt == 4:
                      raise
                  time.sleep(5 * attempt)

          if payload is None:
              raise RuntimeError(f"unable to stage frozen label archive: {last_error}")

          output = Path("inputs/m6_phase_a")
          output.mkdir(parents=True, exist_ok=True)
          archive = output / "training-labels.zip"
          archive.write_bytes(payload)
          digest = hashlib.sha256(payload).hexdigest()
          (output / "training-labels.zip.sha256").write_text(
              digest + "\n", encoding="utf-8"
          )
          print(
              "M6_PHASE_A_LABEL_CACHE=VERIFIED "
              f"calibration_labels={len(expected_patients)} archive_sha256={digest}"
          )
          PY

      - name: Upload verified workflow-local label cache
        uses: actions/upload-artifact@v7.0.1
        with:
          name: m6-phase-a-label-cache
          path: |
            inputs/m6_phase_a/training-labels.zip
            inputs/m6_phase_a/training-labels.zip.sha256
          if-no-files-found: error
          retention-days: 1

  anatomy:
    needs: [preflight, labels]
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        patient: ${{ fromJSON(needs.preflight.outputs.patients) }}

    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install package and execution dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[realdata]"

      - name: Verify source-pinned Phase A authorization
        run: python scripts/m6_phase_a_calibration.py --verify-only

      - name: Download verified workflow-local label cache
        uses: actions/download-artifact@v8.0.1
        with:
          name: m6-phase-a-label-cache
          path: inputs/m6_phase_a

      - name: Run frozen calibration anatomy
        id: shard
        continue-on-error: true
        env:
          PATIENT: ${{ matrix.patient }}
          LABEL_ARCHIVE: ${{ github.workspace }}/inputs/m6_phase_a/training-labels.zip
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import runpy
          from pathlib import Path

          patient = os.environ["PATIENT"]
          archive = Path(os.environ["LABEL_ARCHIVE"])
          if not archive.is_file():
              raise RuntimeError(f"verified label cache is missing: {archive}")

          freeze = json.loads(
              Path("research/M6_PHASE_A_INPUT_FREEZE.json").read_text(encoding="utf-8")
          )["calibration"]
          if patient not in freeze:
              raise RuntimeError(f"patient is absent from frozen input registry: {patient}")

          phase = runpy.run_path(
              "scripts/m6_phase_a_calibration.py",
              run_name="m6_phase_a_cached_execution",
          )
          labels = phase["BASE"]["label_members"](archive.read_bytes())
          observed_label_sha = hashlib.sha256(labels[patient]).hexdigest()
          expected_label_sha = freeze[patient]["label_sha256"]
          if observed_label_sha != expected_label_sha:
              raise RuntimeError(
                  f"frozen label identity mismatch for {patient}: "
                  f"{observed_label_sha} != {expected_label_sha}"
              )

          phase["BASE"]["TRAINING_LABEL_URL"] = archive.resolve().as_uri()
          output = phase["run_patient"](patient, Path("outputs/m6_phase_a"))
          print(f"M6_PHASE_A_SHARD_PATH={output}")
          PY

      - name: Validate calibration-only shard boundary and frozen input identity
        if: always()
        env:
          PATIENT: ${{ matrix.patient }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          patient = os.environ["PATIENT"]
          path = Path("outputs/m6_phase_a/shards") / f"{patient}.json"
          record = json.loads(path.read_text(encoding="utf-8"))
          freeze = json.loads(
              Path("research/M6_PHASE_A_INPUT_FREEZE.json").read_text(encoding="utf-8")
          )["calibration"][patient]

          assert record["patient_id"] == patient
          assert record["evaluation_accessed"] is False
          assert record["series_uid"] == freeze["series_uid"]
          assert record["geometry_sha256"] == freeze["geometry_sha256"]
          if record["primary_complete"]:
              assert record["dicom_zip_sha256"] == freeze["dicom_zip_sha256"]
              assert record["label_sha256"] == freeze["label_sha256"]
              assert len(record["known_error_mm"]) == 50
              assert len(record["sigma_mm"]) == 50
              assert len(record["sigma_scores"]) == 50
              checkpoint = Path("outputs/m6_phase_a/checkpoints") / f"{patient}.npz"
              assert checkpoint.is_file()
          print(
              f"M6_PHASE_A_SHARD=RECORDED patient={patient} "
              f"primary_complete={record['primary_complete']}"
          )
          PY

      - name: Upload immutable anatomy evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: m6-phase-a-${{ matrix.patient }}
          path: |
            outputs/m6_phase_a/shards/${{ matrix.patient }}.json
            outputs/m6_phase_a/checkpoints/${{ matrix.patient }}.npz
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: anatomy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[realdata]"

      - name: Verify source-pinned Phase A authorization
        run: python scripts/m6_phase_a_calibration.py --verify-only

      - name: Download all calibration anatomy evidence
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: "m6-phase-a-*"
          path: phase-a-shards
          merge-multiple: true

      - name: Remove transport-only cache from aggregate input tree
        run: rm -f phase-a-shards/training-labels.zip phase-a-shards/training-labels.zip.sha256

      - name: Fit frozen source-specific HCP thresholds
        id: aggregate
        continue-on-error: true
        run: |
          python scripts/m6_phase_a_calibration.py \
            --aggregate-root phase-a-shards \
            --aggregate-output outputs/m6_phase_a/m6_phase_a_calibration.json

      - name: Hash Phase A evidence
        if: always()
        run: |
          mkdir -p outputs/m6_phase_a
          find phase-a-shards -type f -name '*.json' -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > outputs/m6_phase_a/m6_phase_a_shards.sha256
          if test -f outputs/m6_phase_a/m6_phase_a_calibration.json; then
            sha256sum outputs/m6_phase_a/m6_phase_a_calibration.json \
              > outputs/m6_phase_a/m6_phase_a_calibration.sha256
          fi

      - name: Upload final Phase A evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: truemargin-m6-phase-a-calibration
          path: |
            research/M6_PHASE_A_REQUEST.json
            research/M6_SPLIT.json
            research/M6_PHASE_A_GEOMETRY_FREEZE.json
            research/M6_PHASE_A_INPUT_FREEZE.json
            research/M6_PHASE_A_DIAGNOSTIC_1.json
            docs/m6_calibration_protocol.md
            docs/m6_calibration_protocol_amendment_1.md
            outputs/m6_phase_a/m6_phase_a_calibration.json
            outputs/m6_phase_a/m6_phase_a_calibration.sha256
            outputs/m6_phase_a/m6_phase_a_shards.sha256
            phase-a-shards
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce primary Phase A outcome
        if: always()
        run: test "${{ steps.aggregate.outcome }}" = "success"
